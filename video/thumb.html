<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leash thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #0b0a09;
        --ink: #ece7e1;
        --ink-2: #9d958c;
        --amber: #dfa33c;
        --ui: "Archivo", "Segoe UI", system-ui, sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1280px;
        height: 720px;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--ui);
        overflow: hidden;
        position: relative;
      }

      /* -- the screenshots ---------------------------------------------- */

      /* Three real frames from the app, angled and overlapping so the shape
         reads as "software" from across a room, before any of the detail
         does. They are turned well down: at sidebar size a bright interface
         behind a logo is just texture competing with the only thing that
         has to survive. */
      .shots {
        position: absolute;
        inset: -8%;
        transform: rotate(-7deg);
      }
      .shot {
        position: absolute;
        width: 760px;
        border-radius: 10px;
        border: 1px solid rgba(236, 231, 225, 0.14);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.7);
        /* Brightened, not just faded up. The interface is near-black by
           design, so a dark screenshot at half opacity over a dark ground
           is an empty rectangle: the first version of this had three of
           them and you could not see one. Lifting the exposure is what
           makes it read as a dense product UI; the veil below then takes
           the brightness back out of the middle where the name sits. */
        filter: brightness(2.1) contrast(1.04) saturate(1.1);
      }
      .shot img { display: block; width: 100%; border-radius: inherit; }

      .shot.a { top: -40px; left: 40px; }
      .shot.b { top: 300px; left: 560px; width: 700px; }
      .shot.c { top: 60px; left: 1000px; width: 720px; }

      /* -- the lighting -------------------------------------------------- */

      /* A hole burned in the middle so the wordmark sits on near-black, and
         the corners pulled down so nothing competes at the edges. This is
         what makes the logo legible rather than the logo being bigger. */
      .veil {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(46% 50% at 50% 48%, rgba(11, 10, 9, 0.94) 24%, rgba(11, 10, 9, 0.6) 58%, transparent 82%),
          radial-gradient(125% 105% at 50% 50%, transparent 46%, rgba(11, 10, 9, 0.8) 92%),
          linear-gradient(180deg, rgba(11, 10, 9, 0.3), rgba(11, 10, 9, 0.12) 40%, rgba(11, 10, 9, 0.55));
      }
      /* The one warm note, borrowed from the product's own amber. */
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(40% 44% at 50% 46%, rgba(223, 163, 60, 0.13), transparent 70%);
      }

      /* -- the logo ------------------------------------------------------ */

      .lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
      }
      .mark-row {
        display: flex;
        align-items: center;
        gap: 34px;
      }
      /* The app's own mark: an anchor point, a cord with slack in it, and
         the collar at the far end. Not the favicon's loop-and-handle,
         which works at 16px in a browser tab and reads as the symbol for
         Mars once it is four inches wide. */
      svg.mark {
        width: 252px;
        height: 140px;
        overflow: visible;
        filter: drop-shadow(0 6px 30px rgba(0, 0, 0, 0.9));
      }
      .anchor { fill: var(--amber); }
      .cord,
      .collar { fill: none; stroke: var(--ink); stroke-linecap: round; }

      .word {
        font-weight: 800;
        font-size: 158px;
        line-height: 0.9;
        letter-spacing: 0.005em;
        /* A whisper of a shadow, so the letters hold their edge wherever a
           screenshot happens to sit behind them. */
        text-shadow: 0 6px 40px rgba(0, 0, 0, 0.85);
      }

      .tag {
        font-size: 36px;
        font-weight: 600;
        letter-spacing: 0.005em;
        color: var(--ink-2);
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9);
      }
      .tag b { color: var(--ink); font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="shots">
      <div class="shot a"><img src="thumb/a.jpg" alt="" /></div>
      <div class="shot b"><img src="thumb/b.jpg" alt="" /></div>
      <div class="shot c"><img src="thumb/c.jpg" alt="" /></div>
    </div>
    <div class="veil"></div>
    <div class="glow"></div>

    <div class="lockup">
      <div class="mark-row">
        <svg class="mark" viewBox="0 0 27 15" aria-hidden="true">
          <circle class="anchor" cx="2.6" cy="3" r="2.6" />
          <path class="cord" d="M2.6 3 C 6 13.6, 16.5 13.6, 23.4 5.8" stroke-width="1.4" />
          <circle class="collar" cx="23.6" cy="5.6" r="2.3" stroke-width="1.4" />
        </svg>
        <span class="word">Leash</span>
      </div>
      <div class="tag">a spending limit for <b>AI agents</b></div>
    </div>
  </body>
</html>
