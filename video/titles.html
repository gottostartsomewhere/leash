<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leash — title cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The title cards for the demo video.
       *
       * Same tokens as the app, deliberately. A card that uses different
       * colours or type from the thing it introduces reads as stock motion
       * graphics bolted onto a product, which is exactly the impression to
       * avoid.
       *
       * Open fullscreen, screen-record, press space to advance. The helper
       * bar is hidden until you press H so it never lands in a take. */

      :root {
        --ground: #0b0a09;
        --ink: #ece7e1;
        --ink-2: #9d958c;
        --ink-3: #6a635c;
        --ink-4: #4a443e;
        --amber: #dfa33c;
        --red: #e2553d;
        --green: #7fa37a;
        --ui: "Archivo", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--ui);
        overflow: hidden;
        cursor: none;
      }

      /* 16:9 at any window size, so what you record is what you composed. */
      #stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      .scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        /* Keeps everything off the edge if you capture narrower than 1080p. */
        padding: clamp(24px, 5vw, 110px);
        opacity: 0;
        pointer-events: none;
      }

      .scene.live { opacity: 1; }

      /* -- shared bits ---------------------------------------------------- */

      .lines {
        display: flex;
        flex-direction: column;
        gap: 1.1em;
        font-family: var(--mono);
        font-size: clamp(20px, 2.9vw, 54px);
        line-height: 1.25;
        letter-spacing: -0.01em;
      }

      .line {
        white-space: pre;
        color: var(--ink);
        transition: color 600ms ease;
      }

      .line.dim { color: var(--ink-4); }
      .line.amber { color: var(--amber); }

      .caret {
        display: inline-block;
        width: 0.56em;
        height: 1.05em;
        margin-left: 0.08em;
        background: var(--amber);
        vertical-align: -0.17em;
        animation: blink 1.05s steps(1) infinite;
      }

      @keyframes blink { 50% { opacity: 0; } }

      .statement {
        font-size: clamp(30px, 5.2vw, 104px);
        font-weight: 600;
        letter-spacing: -0.025em;
        text-align: center;
        line-height: 1.1;
        max-width: 18ch;
      }

      .rise > * {
        opacity: 0;
        transform: translateY(16px);
        filter: blur(6px);
      }

      .scene.live .rise > * {
        animation: rise 900ms cubic-bezier(0.17, 0.72, 0.21, 1) forwards;
      }

      @keyframes rise {
        to { opacity: 1; transform: none; filter: none; }
      }

      /* -- scene: the evidence -------------------------------------------- */

      .evidence {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.4rem;
        font-family: var(--mono);
      }

      .tally {
        display: flex;
        gap: clamp(28px, 5vw, 96px);
        align-items: flex-end;
        justify-content: center;
        flex-wrap: wrap;
        max-width: 100%;
      }

      .tally div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }

      .tally .n {
        font-size: clamp(38px, 7vw, 132px);
        font-variant-numeric: tabular-nums;
        line-height: 0.9;
        letter-spacing: -0.03em;
      }

      .tally .k {
        font-size: clamp(10px, 1vw, 15px);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      .verdict {
        font-size: clamp(14px, 1.5vw, 26px);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--green);
        border: 1px solid color-mix(in oklab, var(--green) 40%, transparent);
        padding: 0.55em 1.4em;
      }

      /* -- scene: end card ------------------------------------------------ */

      .end {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.2rem;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 0.7em;
        font-size: clamp(26px, 4.4vw, 88px);
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .wordmark svg { width: 1.5em; height: auto; overflow: visible; }

      /* The tether draws itself, then the ring lands. */
      .scene.live .tether {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: draw 1100ms cubic-bezier(0.3, 0.7, 0.2, 1) 200ms forwards;
      }

      @keyframes draw { to { stroke-dashoffset: 0; } }

      .scene.live .ring {
        opacity: 0;
        animation: pop 420ms cubic-bezier(0.2, 1.5, 0.4, 1) 1150ms forwards;
      }

      @keyframes pop {
        from { opacity: 0; transform: scale(0.4); }
        to { opacity: 1; transform: none; }
      }

      .url {
        font-family: var(--mono);
        font-size: clamp(13px, 1.5vw, 28px);
        color: var(--ink-2);
        letter-spacing: 0.04em;
      }

      /* -- lower third ----------------------------------------------------- */

      .lower {
        position: absolute;
        left: clamp(28px, 5vw, 96px);
        bottom: clamp(28px, 7vh, 110px);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        place-self: start;
      }

      .lower .bar {
        width: 0;
        height: 2px;
        background: var(--amber);
      }

      .scene.live .lower .bar {
        animation: wipe 700ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes wipe { to { width: clamp(120px, 14vw, 260px); } }

      .lower .name {
        font-size: clamp(22px, 2.8vw, 52px);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .lower .what {
        font-family: var(--mono);
        font-size: clamp(11px, 1.2vw, 21px);
        color: var(--ink-2);
      }

      /* -- helper, never recorded ------------------------------------------ */

      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        display: none;
        gap: 14px;
        align-items: center;
        padding: 7px 12px;
        background: #16120f;
        border: 1px solid #2b2622;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--ink-2);
        z-index: 99;
      }

      #hud.on { display: flex; }
      #hud b { color: var(--ink); font-weight: 500; }
      #hud .key { color: var(--ink-4); }
    </style>
  </head>
  <body>
    <div id="hud">
      <span>scene <b id="idx">1</b>/<b id="count">6</b></span>
      <span id="label"></span>
      <span>hold <b id="hold"></b></span>
      <span class="key">space next · ← back · R replay · H hide</span>
    </div>

    <div id="stage">
      <!-- 1 · the problem -->
      <section class="scene" data-label="the problem" data-hold="18s">
        <div class="lines" id="problem"></div>
      </section>

      <!-- 2 · lower third -->
      <section class="scene" data-label="lower third" data-hold="4s">
        <div class="lower rise">
          <div class="bar"></div>
          <div class="name">Leash</div>
          <div class="what">Spending authority for AI agents</div>
        </div>
      </section>

      <!-- 3 · the statement -->
      <section class="scene" data-label="structuring card" data-hold="2s">
        <div class="rise">
          <div class="statement">Two addresses.<br />One merchant.</div>
        </div>
      </section>

      <!-- 4 · the evidence -->
      <section class="scene" data-label="red team" data-hold="6s">
        <div class="evidence rise">
          <div class="tally">
            <div><span class="n" data-to="338">0</span><span class="k">Attempts</span></div>
            <div><span class="n" data-to="319">0</span><span class="k">Refused</span></div>
            <div><span class="n" data-to="0">0</span><span class="k">Got through</span></div>
          </div>
          <div class="verdict">Mandate held</div>
        </div>
      </section>

      <!-- 5 · the close -->
      <section class="scene" data-label="closing line" data-hold="7s">
        <div class="lines" id="closing"></div>
      </section>

      <!-- 6 · end card -->
      <section class="scene" data-label="end card" data-hold="4s">
        <div class="end rise">
          <div class="wordmark">
            <svg viewBox="0 0 27 15" aria-hidden="true">
              <circle cx="2.6" cy="3" r="2.6" fill="currentColor" />
              <path class="tether" d="M2.6 3 C 6 13.6, 16.5 13.6, 23.4 5.8"
                    fill="none" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" />
              <circle class="ring" cx="23.6" cy="5.6" r="2.3" fill="none"
                      stroke="currentColor" stroke-width="1.4"
                      style="transform-origin: 23.6px 5.6px" />
            </svg>
            <span>Leash</span>
          </div>
          <div class="url">leash-web.onrender.com</div>
        </div>
      </section>
    </div>

    <script>
      // Typed lines. Word-by-word reads as deliberate; character-by-character
      // reads as a terminal, which is what this project is.
      const PROBLEM = [
        { text: "the agent books the flight", wait: 900 },
        { text: "the agent orders the parts", wait: 900 },
        { text: "the agent pays the invoice", wait: 1400 },
        { text: "and if it gets it wrong", amber: true, dimRest: true, wait: 0 },
      ];

      const CLOSING = [
        { text: "Every other demo shows you", wait: 260 },
        { text: "what their agent can buy.", wait: 1500 },
        { text: "This one shows you what it can't.", amber: true, wait: 0 },
      ];

      const scenes = [...document.querySelectorAll(".scene")];
      const hud = document.getElementById("hud");
      let at = 0;
      let running = null;

      document.getElementById("count").textContent = scenes.length;

      const sleep = (ms) => new Promise((r) => (running = setTimeout(r, ms)));

      async function type(host, spec, speed = 38) {
        host.innerHTML = "";
        const rows = [];
        for (const step of spec) {
          const row = document.createElement("div");
          row.className = "line" + (step.amber ? " amber" : "");
          host.appendChild(row);
          rows.push(row);

          if (step.dimRest) rows.slice(0, -1).forEach((r) => r.classList.add("dim"));

          const caret = document.createElement("span");
          caret.className = "caret";
          row.appendChild(caret);

          for (const ch of step.text) {
            caret.insertAdjacentText("beforebegin", ch);
            await sleep(speed + (ch === " " ? 24 : 0));
          }
          caret.remove();
          if (step.wait) await sleep(step.wait);
        }
        const last = rows[rows.length - 1];
        const caret = document.createElement("span");
        caret.className = "caret";
        last.appendChild(caret);
      }

      function countUp(scene) {
        scene.querySelectorAll("[data-to]").forEach((el) => {
          const to = Number(el.dataset.to);
          if (to === 0) { el.textContent = "0"; return; }
          const started = performance.now();
          const ms = 1100;
          const tick = (now) => {
            const p = Math.min(1, (now - started) / ms);
            // Ease out, so it settles rather than stopping dead.
            el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
            if (p < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        });
      }

      function play(i) {
        clearTimeout(running);
        at = (i + scenes.length) % scenes.length;
        scenes.forEach((s) => s.classList.remove("live"));
        const scene = scenes[at];

        // Re-trigger CSS animations by reflowing the subtree.
        scene.querySelectorAll(".rise, .tether, .ring, .bar").forEach((el) => {
          el.style.animation = "none";
          void el.offsetWidth;
          el.style.animation = "";
        });

        scene.classList.add("live");
        document.getElementById("idx").textContent = at + 1;
        document.getElementById("label").textContent = scene.dataset.label;
        document.getElementById("hold").textContent = scene.dataset.hold;

        if (at === 0) type(document.getElementById("problem"), PROBLEM);
        if (at === 4) type(document.getElementById("closing"), CLOSING, 34);
        if (at === 3) countUp(scene);
      }

      addEventListener("keydown", (e) => {
        if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") {
          e.preventDefault();
          play(at + 1);
        } else if (e.key === "ArrowLeft") {
          play(at - 1);
        } else if (e.key.toLowerCase() === "r") {
          play(at);
        } else if (e.key.toLowerCase() === "h") {
          hud.classList.toggle("on");
        } else if (e.key.toLowerCase() === "f") {
          document.documentElement.requestFullscreen?.();
        }
      });

      // Driven by record.mjs, which jumps straight to a scene and replays it
      // so each card is captured on its own with a clean start.
      window.leash = {
        play,
        count: scenes.length,
        labels: scenes.map((s) => s.dataset.label),
        holds: scenes.map((s) => s.dataset.hold),
      };

      play(0);
    </script>
  </body>
</html>
