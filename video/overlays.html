<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Leash — overlays</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Transparent callout layer, composited over the app footage.
       *
       * Everything is driven from `render(scene, t)` rather than from CSS
       * animations, so a frame grabbed at t is always identical. A recorder
       * stepping frame by frame cannot rely on wall-clock animations.
       *
       * Positions are in the 1920x1080 frame the app was captured at, and
       * the compositing happens before the push, so these travel with the
       * shot instead of sliding against it. */

      :root {
        --ink: #ece7e1;
        --ink-2: #9d958c;
        --ink-3: #6a635c;
        --amber: #dfa33c;
        --red: #e2553d;
        --green: #7fa37a;
        --ui: "Archivo", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }

      * { box-sizing: border-box; margin: 0; }

      html, body {
        width: 1920px;
        height: 1080px;
        background: transparent;
        overflow: hidden;
        font-family: var(--ui);
        color: var(--ink);
      }

      .scene { position: absolute; inset: 0; display: none; }
      .scene.on { display: block; }

      /* A panel sitting in the app's empty middle, dark enough to read on
       * but transparent enough that it is clearly an overlay. */
      .panel {
        position: absolute;
        background: rgba(11, 10, 9, 0.93);
        border: 1px solid #2b2622;
        padding: 34px 44px;
      }

      .kicker {
        font-size: 13px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: 22px;
      }

      .row {
        display: grid;
        grid-template-columns: 300px 1fr;
        align-items: baseline;
        gap: 28px;
        padding: 9px 0;
      }

      .row .k {
        font-size: 19px;
        letter-spacing: 0.04em;
        color: var(--ink-2);
      }

      .row .v {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 52px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        position: relative;
        display: inline-block;
      }

      .row .v.amber { color: var(--amber); }
      .row .v.green { color: var(--green); }
      .row .v.red { color: var(--red); }

      /* The strike is drawn, not faded, so the eye follows it. */
      .strike {
        position: absolute;
        left: -6px;
        top: 52%;
        height: 3px;
        background: var(--red);
      }

      .sum {
        display: flex;
        align-items: baseline;
        gap: 26px;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 64px;
        letter-spacing: -0.02em;
      }

      .sum .op { color: var(--ink-3); font-size: 44px; }
      .sum .red { color: var(--red); }

      .note {
        margin-top: 18px;
        font-size: 20px;
        color: var(--ink-2);
        letter-spacing: 0.01em;
      }

      .note b { color: var(--red); font-weight: 500; }

      /* A band of light crossing the panel as it lands. */
      .band {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 34%;
        opacity: 0;
        background: linear-gradient(
          100deg,
          transparent,
          rgba(223, 163, 60, 0.13),
          transparent
        );
        pointer-events: none;
      }

      .panel { overflow: hidden; }

      /* Pushes out from where the stamp landed. */
      .shock {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 720px;
        height: 200px;
        margin: -100px 0 0 -360px;
        border: 3px solid var(--red);
        opacity: 0;
      }

      /* Revoke stamp */
      .stamp {
        position: absolute;
        left: 50%;
        top: 46%;
        transform-origin: center;
        border: 4px solid var(--red);
        color: var(--red);
        font-size: 92px;
        font-weight: 700;
        letter-spacing: 0.22em;
        padding: 18px 46px 18px 68px;
      }
    </style>
  </head>
  <body>
    <!-- shopping: what it asked for, what it was told, what it came back with -->
    <section class="scene" id="shop">
      <div class="panel" style="left: 470px; top: 310px; width: 980px">
        <i class="band"></i>
        <div class="kicker" data-el="kicker">The agent's working</div>
        <div class="row" data-el="r1">
          <span class="k" data-el="k1">It asked for</span>
          <span class="v amber"
            ><span data-el="n1">0</span><i class="strike" data-el="strike"></i
          ></span>
        </div>
        <div class="row" data-el="r2">
          <span class="k" data-el="k2">The mandate said</span>
          <span class="v"
            ><span data-el="n2">0</span
            ><span data-el="n2tail"> would clear</span></span
          >
        </div>
        <div class="row" data-el="r3">
          <span class="k" data-el="k3">So it came back with</span>
          <span class="v green" data-el="n3">0</span>
        </div>
      </div>
    </section>

    <!-- structuring: the arithmetic that makes the catch obvious -->
    <section class="scene" id="structuring">
      <div class="panel" style="left: 470px; top: 600px; width: 1020px">
        <i class="band"></i>
        <div class="kicker" data-el="kicker">Two charges, one merchant</div>
        <div class="sum">
          <span data-el="a">0</span>
          <span class="op" data-el="plus">+</span>
          <span data-el="b">0</span>
          <span class="op" data-el="eq">=</span>
          <span class="red" data-el="total">0</span>
        </div>
        <div class="note" data-el="note">Each one clears the 100.00 cap on its own. Together they do not.</div>
      </div>
    </section>

    <!-- revoke -->
    <section class="scene" id="revoke">
      <div class="shock" data-el="shock"></div>
      <div class="stamp" data-el="stamp">REVOKED</div>
    </section>

    <script src="motion.js"></script>
    <script>
      const { ease, cue, kinetic, wipe, tighten, roll, sweep } = window.Motion;

      const $ = (scene, el) =>
        document.querySelector(`#${scene} [data-el="${el}"]`);

      /** The panel itself arrives: a hairline grows, then the body lands. */
      function panel(scene, t, start) {
        const box = document.querySelector(`#${scene} .panel`);
        const p = cue(t, start, 0.42, ease.hard);
        box.style.opacity = p;
        box.style.transform = `translateY(${(1 - p) * 18}px)`;
        box.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`;
        const band = document.querySelector(`#${scene} .band`);
        if (band) sweep(band, cue(t, start + 0.12, 0.65, ease.inOut));
      }

      const SCENES = {
        shop(t) {
          panel("shop", t, 3.9);
          wipe($("shop", "kicker"), cue(t, 4.1, 0.45, ease.hard));

          // Rolls up rather than appearing, so the size of it registers.
          roll($("shop", "n1"), 999, cue(t, 4.4, 0.75));
          kinetic($("shop", "k1"), t, 4.45, { gap: 0.012, dur: 0.34, rise: 14 });

          roll($("shop", "n2"), 100, cue(t, 5.5, 0.6));
          kinetic($("shop", "k2"), t, 5.55, { gap: 0.012, dur: 0.34, rise: 14 });
          wipe($("shop", "n2tail"), cue(t, 6.0, 0.4, ease.hard));

          // The strike draws, then the refused number fades back.
          const st = cue(t, 6.2, 0.4, ease.hard);
          const strike = $("shop", "strike");
          strike.style.width = `${st * 236}px`;
          strike.style.opacity = st > 0 ? 1 : 0;
          const row1 = $("shop", "r1");
          row1.style.opacity = 1 - 0.45 * cue(t, 6.6, 0.5);

          roll($("shop", "n3"), 90.55, cue(t, 7.0, 0.7));
          kinetic($("shop", "k3"), t, 7.05, { gap: 0.012, dur: 0.34, rise: 14 });
          const pop = cue(t, 7.5, 0.45, ease.back);
          $("shop", "n3").style.transform = `scale(${0.86 + 0.14 * pop})`;
        },

        structuring(t) {
          panel("structuring", t, 4.9);
          wipe($("structuring", "kicker"), cue(t, 5.1, 0.45, ease.hard));

          roll($("structuring", "a"), 75, cue(t, 5.4, 0.5));
          const plus = cue(t, 6.0, 0.3, ease.back);
          $("structuring", "plus").style.opacity = plus;
          $("structuring", "plus").style.transform = `scale(${0.5 + 0.5 * plus})`;

          roll($("structuring", "b"), 75, cue(t, 6.3, 0.5));
          const eq = cue(t, 7.0, 0.3, ease.back);
          $("structuring", "eq").style.opacity = eq;
          $("structuring", "eq").style.transform = `scale(${0.5 + 0.5 * eq})`;

          // The total resolves with a slight overshoot, then settles.
          roll($("structuring", "total"), 150, cue(t, 7.3, 0.65));
          const land = cue(t, 7.3, 0.6, ease.back);
          const tot = $("structuring", "total");
          tot.style.opacity = land;
          tot.style.transform = `scale(${0.76 + 0.24 * land})`;

          kinetic($("structuring", "note"), t, 8.3, { gap: 0.009, dur: 0.3, rise: 12 });
        },

        revoke(t) {
          const p = cue(t, 5.2, 0.4, ease.back);
          const el = $("revoke", "stamp");
          el.style.opacity = Math.min(1, p * 1.6);
          el.style.transform =
            `translate(-50%, -50%) rotate(-11deg) scale(${1.55 - 0.55 * p})`;
          // A ring pushes out from where it landed, like an impact.
          const ring = $("revoke", "shock");
          const s = cue(t, 5.55, 0.75, ease.out);
          ring.style.opacity = s > 0 && s < 1 ? (1 - s) * 0.55 : 0;
          ring.style.transform =
            `translate(-50%, -50%) rotate(-11deg) scale(${1 + s * 0.5})`;
        },
      };

      window.overlay = {
        render(scene, t) {
          for (const node of document.querySelectorAll(".scene")) {
            node.classList.toggle("on", node.id === scene);
          }
          SCENES[scene]?.(t);
        },
        scenes: Object.keys(SCENES),
      };
    </script>
  </body>
</html>
