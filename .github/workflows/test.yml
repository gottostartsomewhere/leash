# Every push runs the whole suite and builds the screen.
#
# No secrets on purpose. Every credentialed dependency, PayPal, Channel3 and
# the model, has an offline deterministic stand-in, and the suite pins the
# settings so a key in the environment cannot change what it tests. A green
# run here is the same green run anyone gets after a clone.

name: test

on:
  push:
  pull_request:

jobs:
  engine:
    name: engine, 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  screen:
    name: screen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        run: npm run build
