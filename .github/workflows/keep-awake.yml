# Keeps the free API warm by pinging it.
#
# Off by default, and meant to be switched on for a judging window rather
# than left running. Render does not officially support keeping free services
# awake, so this is a deliberate choice for a limited period.
#
# Enable it in the Actions tab, and set the LEASH_API_URL repository variable
# (Settings → Secrets and variables → Actions → Variables) to the API's
# address, for example https://leash-api.onrender.com

name: keep the api awake

on:
  workflow_dispatch:
  schedule:
    # Every ten minutes. The service sleeps after fifteen idle.
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Knock on /health
        env:
          API: ${{ vars.LEASH_API_URL }}
        run: |
          if [ -z "$API" ]; then
            echo "LEASH_API_URL is not set, nothing to ping."
            exit 0
          fi
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 90 "$API/health")
          echo "HTTP $code"
          cat /tmp/body
          echo
          test "$code" = "200"
