[project]
name = "leash"
version = "0.1.0"
description = "Scoped, revocable, auditable spending authority for AI agents"
requires-python = ">=3.11"

# Declared properly rather than left to whatever happens to be on the machine.
# An empty list worked locally and would have deployed an application with no
# web framework in it.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # The Model Context Protocol endpoint at /mcp. Pinned to 2.x: the 2.0
    # release renamed FastMCP to MCPServer and changed the transport API.
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["leash"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # pytest-asyncio on Python 3.14, not our code.
    "ignore:'asyncio.*event_loop_policy' is deprecated:DeprecationWarning",
]
